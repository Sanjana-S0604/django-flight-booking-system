{% extends 'main.html' %}

{% block content %}

<center>

    <h1>Flight Booking Form</h1>

    <form method="POST">
        {% csrf_token %}

        <h2>Flight Details</h2>

        <label>Flight Company :</label><br>
        <input type="text" value="{{ booking.flight.company }}" readonly><br><br>

        <label>Flight Name :</label><br>
        <input type="text" value="{{ booking.flight.flight_name }}" readonly><br><br>

        <label>Flight Number :</label><br>
        <input type="text" value="{{ booking.flight.flight_no }}" readonly><br><br>

        <label>From :</label><br>
        <input type="text" value="{{ booking.flight.from_city }}" readonly><br><br>

        <label>To :</label><br>
        <input type="text" value="{{ booking.flight.to_city }}" readonly><br><br>

        <label>Departure :</label><br>
        <input type="text" value="{{ booking.flight.departure }}" readonly><br><br>

        <label>Date :</label><br>
        <input type="text" value="{{ booking.flight.date }}" readonly><br><br>

        <label>Price :</label><br>
        <input type="text" value="{{ booking.flight.price }}" readonly><br><br>

        <hr>

        <h2>Passenger Details</h2>

        <label>Name :</label><br>
        <input type="text" name="name" required  value="{{booking.name}}"><br><br>

        <label>Email :</label><br>
        <input type="email" name="email" required value="{{booking.email}}" ><br><br>

        <label>Phone Number :</label><br>
        <input type="text" name="phone" required  value="{{booking.phone}}"><br><br>

        <label>Aadhaar Number :</label><br>
        <input type="text" name="aadhaar" required  value="{{booking.aadhaar}}"><br><br>

        <label>Age :</label><br>
        <input type="number" name="age" required  value="{{booking.age}}"><br><br>

        <label>Seat Class :</label><br>
        <select name="seat_class">
            <option value="Economy">Economy</option>
            <option value="Business">Business</option>
            <option value="First Class">First Class</option>
        </select>
        <br><br>

        <label>Seat Number :</label><br>
        <input type="text" name="seat_number" required  value="{{booking.seat_number}}"><br><br>

        <button type="submit">Update Details</button>

    </form>

</center>

{% endblock %}
