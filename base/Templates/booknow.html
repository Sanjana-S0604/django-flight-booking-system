{% extends 'main.html' %}

{% block content %}

    <h1 class="booking-title">
        ✈ Plane Ticket Booking Form
    </h1>

    <form class="booking-form" method="POST">
        {% csrf_token %}

        <h2>Flight Details</h2>

        <label>Flight Company :</label><br>
        <input type="text" value="{{ flight.company }}" readonly><br><br>

        <label>Flight Name :</label><br>
        <input type="text" value="{{ flight.flight_name }}" readonly><br><br>

        <label>Flight Number :</label><br>
        <input type="text" value="{{ flight.flight_no }}" readonly><br><br>

        <label>From :</label><br>
        <input type="text" value="{{ flight.from_city }}" readonly><br><br>

        <label>To :</label><br>
        <input type="text" value="{{ flight.to_city }}" readonly><br><br>

        <label>Departure :</label><br>
        <input type="text" value="{{ flight.departure }}" readonly><br><br>

        <label>Date :</label><br>
        <input type="text" value="{{ flight.date }}" readonly><br><br>

        <label>Price :</label><br>
        <input type="text" value="{{ flight.price }}" readonly><br><br>

        <hr>

        <h2 class="passenger-section">
            Passenger Details
        </h2>

        <label>Name :</label><br>
        <input type="text" name="name" required><br><br>

        <label>Email :</label><br>
        <input type="email" name="email" required><br><br>

        <label>Phone Number :</label><br>
        <input type="text" name="phone" required><br><br>

        <label>Aadhaar Number :</label><br>
        <input type="text" name="aadhaar" required><br><br>

        <label>Age :</label><br>
        <input type="number" name="age" required><br><br>

        <label>Seat Class :</label><br>
        <select name="seat_class">
            <option value="Economy">Economy</option>
            <option value="Business">Business</option>
            <option value="First Class">First Class</option>
        </select>
        <br><br>

        <label>Seat Number :</label><br>
        <input type="text" name="seat_number" required><br><br>

        <button type="submit">Book Ticket</button>

    </form>


{% endblock %}
